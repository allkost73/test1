name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Variant (debug, release, both)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

permissions:
  contents: write
  actions: write
  packages: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError\" -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  JAVA_OPTS: "-Xmx4096m"

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK and Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Pre-accept licenses in standard paths
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          mkdir -p "$HOME/.android/licenses" 2>/dev/null || true
          
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | tee -a "$ANDROID_HOME/licenses/android-sdk-license" "$HOME/.android/licenses/android-sdk-license" >/dev/null 2>&1 || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" | tee -a "$ANDROID_HOME/licenses/android-sdk-license" "$HOME/.android/licenses/android-sdk-license" >/dev/null 2>&1 || true
          echo "84831b9409646a33ee440757b8e0e914910183ac" | tee -a "$ANDROID_HOME/licenses/android-sdk-preview-license" "$HOME/.android/licenses/android-sdk-preview-license" >/dev/null 2>&1 || true
          
          # Accept licenses using sdkmanager if available
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "platform-tools" "build-tools;36.0.0" 2>/dev/null || true
          elif which sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses 2>/dev/null || true
            sdkmanager "platforms;android-36.1" "platform-tools" "build-tools;36.0.0" 2>/dev/null || true
          fi

      - name: Prepare Build Environment
        run: |
          chmod +x ./gradlew || true
          
          # Prepare .env so secrets-gradle-plugin never fails
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo ".env file initialized."
          fi

          # Prepare debug.keystore from base64 if available
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              (base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null) || (base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null) || true
            fi
          fi
          
          # Generate fallback debug.keystore if still absent
          if [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        continue-on-error: true
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build warning, debug APK will be packaged."

      - name: Collect APK Files
        run: |
          mkdir -p build-apks
          # Copy any generated APK files
          find app/build/outputs/apk -name "*.apk" -exec cp {} build-apks/ \; 2>/dev/null || true
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-apks/SitrakS7H-debug.apk 2>/dev/null || true
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-apks/SitrakS7H-release.apk 2>/dev/null || true
          fi
          
          echo "Collected APK files:"
          ls -lh build-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SitrakS7H-APKs
          path: build-apks/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: build-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
