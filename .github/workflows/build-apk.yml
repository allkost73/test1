name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Variant (debug, release, both)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

permissions:
  contents: write
  actions: write
  packages: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError\" -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  JAVA_OPTS: "-Xmx4096m"

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure gradlew and wrapper exist
        run: |
          chmod +x ./gradlew || true
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, downloading..."
            mkdir -p gradle/wrapper
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar || true
          fi

      - name: Prepare environment and signing keys
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo ".env prepared."
          fi

          # Ensure debug.keystore exists
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              (base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null) || (base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null) || true
            fi
          fi

          # If debug.keystore is still missing or empty, generate a fresh valid one
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "debug.keystore size: $(wc -c < debug.keystore) bytes"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a33ee440757b8e0e914910183ac" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" "platform-tools" "build-tools;36.0.0" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Signing (if secret provided)
        id: release_keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release-upload-key.jks" 2>/dev/null || echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release-upload-key.jks" 2>/dev/null || true
            if [ -s "${{ github.workspace }}/release-upload-key.jks" ]; then
              echo "has_keystore=true" >> $GITHUB_OUTPUT
              echo "Release keystore decoded."
            else
              echo "has_keystore=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No custom RELEASE_KEYSTORE_BASE64 provided. Using built-in debug.keystore signing fallback."
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' || github.event_name == 'push' }}
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/release-upload-key.jks"
          STORE_PASSWORD: "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
          KEY_PASSWORD: "${{ secrets.RELEASE_KEY_PASSWORD }}"
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build warning, continuing with debug APK."

      - name: Run Unit Tests (Non-blocking)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --continue || echo "Tests finished, continuing."

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-apks
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-apks/SitrakS7H-debug.apk
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-apks/SitrakS7H-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-apks/SitrakS7H-release-unsigned.apk
          fi
          
          # Fallback: search for any other APKs produced
          if [ ! "$(ls -A build-apks 2>/dev/null)" ]; then
            find app/build/outputs/apk -name "*.apk" -exec cp {} build-apks/ \; || true
          fi
          
          echo "Collected APKs:"
          ls -lh build-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitrakS7H-APKs
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: build-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
